<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>llm-wiki-pro2 — 個人知識庫</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
:root {
  --bg: #0f1115;
  --bg-panel: #171a21;
  --bg-hover: #1f2430;
  --border: #2a3040;
  --text: #d8dee9;
  --text-dim: #8892a6;
  --accent: #5eead4;
  --accent-2: #818cf8;
  --danger: #f87171;
  --radius: 8px;
}
:root[data-theme="light"] {
  --bg: #f5f6f8;
  --bg-panel: #ffffff;
  --bg-hover: #eef0f4;
  --border: #dde1e8;
  --text: #1f2430;
  --text-dim: #667085;
  --accent: #0d9488;
  --accent-2: #4f46e5;
  --danger: #dc2626;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Noto Sans TC", -apple-system, "Segoe UI", sans-serif;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  transition: background .15s, color .15s;
}
header {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg-panel);
}
header h1 { font-size: 16px; color: var(--accent); font-weight: 600; }
header .sub { font-size: 12px; color: var(--text-dim); }
header .spacer { flex: 1; }
button {
  background: var(--bg-hover); color: var(--text); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 6px 14px; font-size: 13px; cursor: pointer;
  font-family: inherit; transition: border-color .15s;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #0f1115; border: none; font-weight: 600; }
button.primary:hover { opacity: .88; }
button:disabled { opacity: .45; cursor: wait; }
main { flex: 1; display: flex; min-height: 0; }

/* sidebar */
#sidebar {
  width: 280px; min-width: 280px; border-right: 1px solid var(--border);
  background: var(--bg-panel); display: flex; flex-direction: column;
}
.tabs { display: flex; border-bottom: 1px solid var(--border); }
.tabs button {
  flex: 1; border: none; border-radius: 0; background: transparent;
  padding: 10px 0; color: var(--text-dim); border-bottom: 2px solid transparent;
}
.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
#list { flex: 1; overflow-y: auto; padding: 8px; }
.group-label { font-size: 11px; color: var(--text-dim); margin: 10px 6px 4px; text-transform: uppercase; letter-spacing: .05em; }
.item {
  padding: 7px 8px; border-radius: 6px; cursor: pointer; font-size: 13px;
  display: flex; align-items: center; gap: 6px;
}
.item:hover { background: var(--bg-hover); }
.item.active { background: var(--bg-hover); outline: 1px solid var(--accent-2); }
.item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 10px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--border); color: var(--text-dim); }
.badge.ok { color: var(--accent); border-color: var(--accent); }
.side-actions { padding: 10px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
.side-actions button { flex: 1; }

/* content panes */
#panes { flex: 1; display: flex; min-width: 0; }
.pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.pane + .pane { border-left: 1px solid var(--border); }
.pane-head {
  padding: 8px 14px; font-size: 12px; color: var(--text-dim);
  border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;
  background: var(--bg-panel);
}
.pane-head .title { color: var(--accent-2); font-weight: 600; }
.pane-body { flex: 1; overflow-y: auto; padding: 20px 26px; }

/* markdown */
.md h1 { font-size: 22px; margin: 0 0 12px; color: var(--accent); }
.md h2 { font-size: 17px; margin: 22px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.md h3 { font-size: 15px; margin: 16px 0 6px; }
.md p, .md li { line-height: 1.75; font-size: 14px; }
.md ul, .md ol { padding-left: 22px; margin: 8px 0; }
.md a { color: var(--accent-2); text-decoration: none; }
.md a:hover { text-decoration: underline; }
.md code { background: var(--bg-hover); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
.md pre { background: var(--bg-hover); padding: 12px; border-radius: var(--radius); overflow-x: auto; margin: 10px 0; }
.md pre code { background: none; padding: 0; }
.md blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-dim); margin: 10px 0; }
.md table { border-collapse: collapse; margin: 10px 0; }
.md th, .md td { border: 1px solid var(--border); padding: 5px 10px; font-size: 13px; }
.md hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.placeholder { color: var(--text-dim); font-size: 13px; padding: 40px; text-align: center; }

/* query bar */
#querybar {
  display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border);
  background: var(--bg-panel); align-items: center;
}
#querybar input[type=text] {
  flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 9px 12px; color: var(--text); font-size: 14px; font-family: inherit;
}
#querybar input[type=text]:focus { outline: none; border-color: var(--accent); }
#querybar label { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 5px; white-space: nowrap; }

/* modal */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
  align-items: center; justify-content: center; z-index: 10;
}
.modal-bg.show { display: flex; }
.modal {
  background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px;
  width: min(640px, 92vw); max-height: 86vh; display: flex; flex-direction: column;
}
.modal h2 { font-size: 16px; padding: 14px 18px; border-bottom: 1px solid var(--border); color: var(--accent); }
.modal .modal-body { padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.modal input, .modal textarea {
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 9px 12px; color: var(--text); font-size: 13px; font-family: inherit; width: 100%;
}
.modal textarea { min-height: 240px; resize: vertical; font-family: ui-monospace, monospace; }
.modal .modal-foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

#toast {
  position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%);
  background: var(--bg-hover); border: 1px solid var(--accent); border-radius: var(--radius);
  padding: 9px 18px; font-size: 13px; display: none; z-index: 20; max-width: 80vw;
}
#toast.err { border-color: var(--danger); color: var(--danger); }
.spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--text-dim);
  border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 900px) {
  #panes { flex-direction: column; }
  .pane + .pane { border-left: none; border-top: 1px solid var(--border); }
  #sidebar { width: 210px; min-width: 210px; }
}
</style>
</head>
<body>

<header>
  <h1>llm-wiki-pro2</h1>
  <span class="sub">個人知識庫 · LLM Wiki · v0.0.2</span>
  <span class="spacer"></span>
  <button id="btn-add">＋ 新增來源</button>
  <button id="btn-lint">🔍 Wiki 健檢</button>
  <button id="btn-history">📜 版本紀錄</button>
  <button id="btn-theme" title="切換淺色／深色主題">🌙</button>
</header>

<main>
  <aside id="sidebar">
    <div class="tabs">
      <button id="tab-wiki" class="active">Wiki 頁面</button>
      <button id="tab-src">原始來源</button>
    </div>
    <div id="list"></div>
    <div class="side-actions">
      <button id="btn-refresh">重新整理</button>
    </div>
  </aside>

  <div id="panes">
    <section class="pane">
      <div class="pane-head">Wiki　<span class="title" id="wiki-title">index.md</span></div>
      <div class="pane-body md" id="wiki-view"><div class="placeholder">載入中…</div></div>
    </section>
    <section class="pane">
      <div class="pane-head">原始來源　<span class="title" id="src-title">（未選取）</span>
        <span class="spacer" style="flex:1"></span>
        <button id="btn-ingest" style="display:none">⚡ 匯入 Wiki</button>
      </div>
      <div class="pane-body md" id="src-view">
        <div class="placeholder">從左側「原始來源」分頁選一份文件，即可與 Wiki 頁面並排對照。</div>
      </div>
    </section>
  </div>
</main>

<div id="querybar">
  <input type="text" id="q-input" placeholder="向知識庫提問…（例如：Anthropic 對 agent 設計的建議是什麼？）">
  <label><input type="checkbox" id="q-save"> 答案存入 Wiki</label>
  <button class="primary" id="btn-ask">提問</button>
</div>

<div class="modal-bg" id="modal-add">
  <div class="modal">
    <h2>新增來源文件</h2>
    <div class="modal-body">
      <input type="text" id="add-title" placeholder="標題">
      <textarea id="add-content" placeholder="貼上 Markdown 或純文字內容…"></textarea>
    </div>
    <div class="modal-foot">
      <button onclick="closeModal('modal-add')">取消</button>
      <button class="primary" id="btn-add-save">儲存來源</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-answer">
  <div class="modal">
    <h2 id="answer-title">回答</h2>
    <div class="modal-body md" id="answer-body"></div>
    <div class="modal-foot"><button onclick="closeModal('modal-answer')">關閉</button></div>
  </div>
</div>

<div class="modal-bg" id="modal-login">
  <div class="modal" style="width:min(360px,92vw)">
    <h2>需要登入</h2>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--text-dim)">此站台已啟用 API Token 保護，請輸入 Token 才能繼續。</p>
      <input type="password" id="login-token" placeholder="輸入存取 Token">
    </div>
    <div class="modal-foot"><button class="primary" id="btn-login">登入</button></div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = 'api';
let mode = 'wiki';          // sidebar tab
let sources = [];
let wiki = { files: [], index: '' };
let currentSource = null;

const $ = id => document.getElementById(id);
const md = t => (window.marked ? marked.parse(t) : '<pre>' + t.replace(/</g,'&lt;') + '</pre>');

function toast(msg, err=false, ms=3500) {
  const t = $('toast');
  t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms);
}
function closeModal(id) { $(id).classList.remove('show'); }

// ---------- token login (opt-in, only kicks in if the server has API_TOKEN set) ----------
const TOKEN_KEY = 'lw_token';
const getToken = () => localStorage.getItem(TOKEN_KEY) || '';
const setToken = t => localStorage.setItem(TOKEN_KEY, t);
function showLogin() { $('modal-login').classList.add('show'); $('login-token').focus(); }
$('btn-login').onclick = () => {
  const t = $('login-token').value.trim();
  if (!t) return;
  setToken(t);
  closeModal('modal-login');
  $('login-token').value = '';
  refresh().then(() => openWikiPage('index.md')).catch(() => {});
};
$('login-token').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-login').click(); });

async function api(path, opts={}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  const token = getToken();
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch(`${API}/${path}`, { ...opts, headers });
  if (r.status === 401) {
    showLogin();
    throw new Error('需要登入 Token');
  }
  if (!r.ok) {
    let detail = r.statusText;
    try { detail = (await r.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return r.json();
}

// ---------- theme ----------
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  $('btn-theme').textContent = t === 'light' ? '🌙' : '☀️';
  localStorage.setItem('lw_theme', t);
}
$('btn-theme').onclick = () => applyTheme(
  document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'
);
applyTheme(localStorage.getItem('lw_theme') || 'dark');

// ---------- data loading ----------
async function refresh() {
  [sources, wiki] = await Promise.all([api('sources'), api('wiki/tree')]);
  renderList();
}

const DIR_LABELS = { '': '導覽', 'sources': '來源摘要', 'topics': '主題', 'notes': '查詢筆記', 'maintenance': '維護紀錄' };

function renderList() {
  const el = $('list'); el.innerHTML = '';
  if (mode === 'wiki') {
    const groups = {};
    for (const f of wiki.files) (groups[f.dir] = groups[f.dir] || []).push(f);
    for (const dir of ['', 'sources', 'topics', 'notes', 'maintenance']) {
      if (!groups[dir]) continue;
      const lbl = document.createElement('div');
      lbl.className = 'group-label'; lbl.textContent = DIR_LABELS[dir] || dir;
      el.appendChild(lbl);
      for (const f of groups[dir]) {
        const it = document.createElement('div');
        it.className = 'item'; it.dataset.path = f.path;
        it.innerHTML = `<span class="name" title="${f.path}">${f.title}</span>`;
        it.onclick = () => openWikiPage(f.path);
        el.appendChild(it);
      }
    }
  } else {
    if (!sources.length) el.innerHTML = '<div class="placeholder">尚無來源，點右上「＋ 新增來源」。</div>';
    for (const s of sources) {
      const it = document.createElement('div');
      it.className = 'item'; it.dataset.sid = s.id;
      it.innerHTML = `<span class="name" title="${s.filename}">${s.title}</span>
        <span class="badge ${s.status === 'ingested' ? 'ok' : ''}">${s.status === 'ingested' ? '已匯入' : '待匯入'}</span>`;
      it.onclick = () => openSource(s.id);
      el.appendChild(it);
    }
  }
}

function markActive(sel, key, val) {
  document.querySelectorAll('.item').forEach(i => i.classList.toggle('active', i.dataset[key] === val));
}

// ---------- viewers ----------
async function openWikiPage(path) {
  markActive('.item', 'path', path);
  const page = await api(`wiki/page?path=${encodeURIComponent(path)}`);
  $('wiki-title').textContent = path;
  $('wiki-view').innerHTML = md(page.content);
  // intercept relative .md links → open in wiki pane
  $('wiki-view').querySelectorAll('a').forEach(a => {
    const href = a.getAttribute('href') || '';
    if (href.endsWith('.md') && !href.startsWith('http')) {
      a.onclick = e => { e.preventDefault(); openWikiPage(href.replace(/^\.\//, '')); };
    }
  });
}

async function openSource(sid) {
  if (mode === 'src') markActive('.item', 'sid', sid);
  const s = await api(`sources/${sid}`);
  currentSource = s;
  $('src-title').textContent = `${s.title}（${s.id}）`;
  $('src-view').innerHTML = md(s.content);
  const b = $('btn-ingest');
  b.style.display = 'inline-block';
  b.textContent = s.status === 'ingested' ? '⚡ 重新匯入' : '⚡ 匯入 Wiki';
}

// ---------- actions ----------
$('tab-wiki').onclick = () => { mode = 'wiki'; $('tab-wiki').classList.add('active'); $('tab-src').classList.remove('active'); renderList(); };
$('tab-src').onclick  = () => { mode = 'src';  $('tab-src').classList.add('active');  $('tab-wiki').classList.remove('active'); renderList(); };
$('btn-refresh').onclick = () => refresh().then(() => toast('已重新整理'));

$('btn-add').onclick = () => { $('modal-add').classList.add('show'); $('add-title').focus(); };
$('btn-add-save').onclick = async () => {
  const title = $('add-title').value.trim(), content = $('add-content').value;
  if (!title || !content.trim()) return toast('標題與內容皆為必填', true);
  try {
    const s = await api('sources', { method: 'POST', body: JSON.stringify({ title, content }) });
    closeModal('modal-add'); $('add-title').value = ''; $('add-content').value = '';
    await refresh();
    mode = 'src'; $('tab-src').click();
    openSource(s.id);
    toast(`來源已儲存（${s.id}），可按「匯入 Wiki」開始處理`);
  } catch (e) { toast('儲存失敗：' + e.message, true); }
};

$('btn-ingest').onclick = async () => {
  if (!currentSource) return;
  const b = $('btn-ingest');
  b.disabled = true; b.innerHTML = '<span class="spinner"></span> LLM 處理中…（約 30–90 秒）';
  try {
    const r = await api(`sources/${currentSource.id}/ingest`, { method: 'POST' });
    toast(`匯入完成：更新 ${r.pages.length} 頁（commit ${r.commit || '—'}）`, false, 6000);
    await refresh();
    openWikiPage('index.md');
    openSource(currentSource.id);
  } catch (e) { toast('匯入失敗：' + e.message, true, 8000); }
  b.disabled = false; b.textContent = '⚡ 重新匯入';
};

$('btn-ask').onclick = async () => {
  const q = $('q-input').value.trim();
  if (!q) return toast('請先輸入問題', true);
  const b = $('btn-ask');
  b.disabled = true; b.innerHTML = '<span class="spinner"></span> 思考中…';
  try {
    const r = await api('query', { method: 'POST', body: JSON.stringify({ question: q, save: $('q-save').checked }) });
    $('answer-title').textContent = '回答：' + q;
    $('answer-body').innerHTML = md(r.answer) +
      (r.pages_used.length ? `<hr><p style="color:var(--text-dim);font-size:12px">參考頁面：${r.pages_used.join('、')}</p>` : '') +
      (r.saved_page ? `<p style="color:var(--accent);font-size:12px">已存入 Wiki：${r.saved_page}</p>` : '');
    $('modal-answer').classList.add('show');
    if (r.saved_page) refresh();
  } catch (e) { toast('查詢失敗：' + e.message, true, 8000); }
  b.disabled = false; b.textContent = '提問';
};
$('q-input').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-ask').click(); });

$('btn-lint').onclick = async () => {
  const b = $('btn-lint');
  b.disabled = true; b.innerHTML = '<span class="spinner"></span> 健檢中…';
  try {
    const r = await api('lint', { method: 'POST' });
    toast(`健檢完成：發現 ${r.issues_count} 個問題，報告已存為 ${r.report_page}`, false, 6000);
    await refresh();
    openWikiPage(r.report_page);
  } catch (e) { toast('健檢失敗：' + e.message, true, 8000); }
  b.disabled = false; b.textContent = '🔍 Wiki 健檢';
};

const HISTORY_ICONS = [
  [/^wiki: ingest/, '📥'], [/^wiki: query/, '❓'], [/^wiki: lint/, '🔍'],
  [/^source:/, '📄'], [/^meta:/, '⚙️'], [/^wiki: initialize/, '⚙️'],
];
function historyIcon(msg) {
  for (const [re, icon] of HISTORY_ICONS) if (re.test(msg)) return icon;
  return '•';
}
$('btn-history').onclick = async () => {
  try {
    const log = await api('wiki/history?limit=60');
    $('answer-title').textContent = 'Wiki 版本紀錄（git log）';
    const rows = log.map(c =>
      `| ${historyIcon(c.message)} | \`${c.hash}\` | ${c.date} | ${c.message} |`
    ).join('\n');
    $('answer-body').innerHTML = log.length
      ? md(`|  | Commit | 時間 | 說明 |\n|---|---|---|---|\n${rows}`)
      : '<p class="placeholder">尚無紀錄</p>';
    $('modal-answer').classList.add('show');
  } catch (e) { toast('讀取失敗：' + e.message, true); }
};

document.querySelectorAll('.modal-bg:not(#modal-login)').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); }));

// ---------- init ----------
refresh().then(() => openWikiPage('index.md')).catch(e => toast('載入失敗：' + e.message, true));
</script>
</body>
</html>
